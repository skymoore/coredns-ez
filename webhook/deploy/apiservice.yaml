apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.acme.rwx.dev
  annotations:
    cert-manager.io/inject-ca-from: cert-manager/coredns-webhook-tls
spec:
  group: acme.rwx.dev
  groupPriorityMinimum: 1000
  versionPriority: 15
  version: v1alpha1
  service:
    name: coredns-webhook
    namespace: cert-manager
    port: 443
