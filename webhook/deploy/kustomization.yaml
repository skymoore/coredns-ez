apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespaces are set on each object. The authentication-reader RoleBinding
# must stay in kube-system; a top-level namespace: here would rewrite it.

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: coredns-webhook
      app.kubernetes.io/part-of: coredns-ez
      app.kubernetes.io/component: dns01-webhook

resources:
  - serviceaccount.yaml
  - rbac.yaml
  - pki.yaml
  - service.yaml
  - deployment.yaml
  - apiservice.yaml

images:
  - name: ghcr.io/skymoore/coredns-ez-webhook
    newTag: latest
